<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics2Slides</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1 class="logo">Lyrics2Slides</h1>
      <div class="header-controls">
        <label for="bg-color">Background</label>
        <input type="color" id="bg-color" value="#000000" aria-label="Slide background color">
        <details class="header-help">
          <summary class="btn-secondary" aria-label="Help">ℹ️</summary>
          <div class="help-popover">
            <div class="quick-start-title">Quick Start</div>
            <ul class="quick-start-tips">
              <li>Separate slides with <strong>blank lines</strong></li>
              <li>Primary & Secondary lyrics pair by section order</li>
              <li><kbd>&larr;</kbd> <kbd>&rarr;</kbd> Navigate slides</li>
            </ul>
          </div>
        </details>
        <button id="present-btn" class="btn-secondary">Present</button>
        <button id="download-btn" class="btn-primary">Download PPTX</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Left: Lyrics Input -->
      <section class="input-section">
        <div class="tabs">
          <button id="tab-lyrics" class="tab-btn">Lyrics</button>
          <button id="tab-bible" class="tab-btn active">Bible</button>
        </div>

        <div id="lyrics-container" style="display: none;">
          <div class="saved-lyrics-bar">
            <button id="save-lyrics-btn" class="btn-secondary" title="Save to Quick Access">💾 Save song</button>
          </div>

          <div id="saved-lyrics-grid" class="saved-lyrics-grid"></div>

          <!-- Primary -->
          <div class="textarea-group">
            <label for="primary-lyrics">Primary</label>
            <textarea
              id="primary-lyrics"
              placeholder="Paste lyrics here...&#10;&#10;Separate slides with blank lines"
            ></textarea>
            <div class="font-settings">
              <input type="text" id="font-primary" list="font-suggestions" value="Kaiti SC" placeholder="Font name" aria-label="Primary font family">
              <input type="number" id="size-primary" min="8" max="200" value="64" aria-label="Primary font size">
              <span class="size-unit">pt</span>
              <input type="color" id="color-primary" value="#ffff00" aria-label="Primary font color">
              <label class="bold-label"><input type="checkbox" id="bold-primary" checked aria-label="Primary bold">B</label>
            </div>
          </div>

          <!-- Secondary -->
          <div class="textarea-group" id="secondary-group">
            <label for="secondary-lyrics">Secondary</label>
            <textarea
              id="secondary-lyrics"
              placeholder="Paste lyrics here...&#10;&#10;Separate slides with blank lines"
            ></textarea>
            <div class="font-settings" id="secondary-font-group">
              <input type="text" id="font-secondary" list="font-suggestions" value="Calibri" placeholder="Font name" aria-label="Secondary font family">
              <input type="number" id="size-secondary" min="8" max="200" value="40" aria-label="Secondary font size">
              <span class="size-unit">pt</span>
              <input type="color" id="color-secondary" value="#ffff00" aria-label="Secondary font color">
              <label class="bold-label"><input type="checkbox" id="bold-secondary" checked aria-label="Secondary bold">B</label>
            </div>
          </div>
        </div>

        <div id="bible-container">
          <div class="textarea-group" style="margin-bottom: 0.75rem;">
            <label for="bible-smart-input">Search Book & Verse</label>
            <div style="display: flex; gap: 0.5rem; position: relative;">
              <input type="text" id="bible-smart-input" placeholder="e.g., csj 3:16, John 1:1" class="text-input" style="flex: 1;" autocomplete="off">
              <button id="bible-search-btn" class="btn-primary" style="padding: 0.5rem 1rem;" title="Search">🔍</button>
              <button id="bible-book-picker-btn" class="btn-secondary" style="padding: 0.5rem 1rem;" title="Open Book Picker">🗂️</button>
              <button id="save-bible-btn" class="btn-secondary" style="padding: 0.5rem 1rem;" title="Save to Quick Access">💾</button>
              
              <!-- Autocomplete Dropdown -->
              <div id="bible-autocomplete-dropdown" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 4px; max-height: 200px; overflow-y: auto; z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <!-- Items will be injected here -->
              </div>
            </div>
          </div>
          
          <div class="control-row">
            <div class="textarea-group" style="margin-bottom: 0;">
              <label for="bible-translation-primary">Primary</label>
              <select id="bible-translation-primary" class="text-input">
                <option value="CUNPSS-神" selected>CUNPSS (The Chinese Union Version)</option>
                <option value="NIV">NIV (New International Version)</option>
                <option value="KJV">KJV (King James Version)</option>
              </select>
            </div>

            <div class="textarea-group" style="margin-bottom: 0;">
              <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary);">
                <input type="checkbox" id="bible-secondary-enable"> Secondary
              </label>
              <select id="bible-translation-secondary" class="text-input" disabled>
                <option value="NIV">NIV (New International Version)</option>
                <option value="CUNPSS-神">CUNPSS (The Chinese Union Version)</option>
                <option value="KJV" selected>KJV (King James Version)</option>
              </select>
            </div>
          </div>

          <div id="saved-verses-grid" class="saved-verses-grid"></div>

          <div class="textarea-group">
            <label for="bible-primary-text">Primary Verses (Editable)</label>
            <textarea id="bible-primary-text" placeholder="Fetched verses will appear here..."></textarea>
            <div class="font-settings" id="bible-primary-font-group">
              <input type="text" id="bible-font-primary" list="font-suggestions" value="Kaiti SC" placeholder="Font name">
              <input type="number" id="bible-size-primary" min="8" max="200" value="40">
              <span class="size-unit">pt</span>
              <input type="color" id="bible-color-primary" value="#ffff00">
              <label class="bold-label"><input type="checkbox" id="bible-bold-primary" checked>B</label>
            </div>
          </div>

          <div class="textarea-group" id="bible-secondary-group" style="opacity: 0.4; pointer-events: none; margin-top: 1rem;">
            <label for="bible-secondary-text">Secondary Verses (Editable)</label>
            <textarea id="bible-secondary-text" placeholder="Fetched verses will appear here..." disabled></textarea>
            <div class="font-settings" id="bible-secondary-font-group">
              <input type="text" id="bible-font-secondary" list="font-suggestions" value="Calibri" placeholder="Font name">
              <input type="number" id="bible-size-secondary" min="8" max="200" value="40">
              <span class="size-unit">pt</span>
              <input type="color" id="bible-color-secondary" value="#ffff00">
              <label class="bold-label"><input type="checkbox" id="bible-bold-secondary" checked>B</label>
            </div>
          </div>
        </div>
      </section>

      <!-- Right: Slide Preview -->
      <section class="preview-section">
        <div id="slide-preview" class="slide-preview">
          <div class="slide-content">
            <div id="primary-text" class="primary-text"></div>
            <div id="secondary-text" class="secondary-text"></div>
          </div>
        </div>
        <div class="slide-nav">
          <button id="prev-btn" class="nav-btn" aria-label="Previous slide">&lt;</button>
          <span id="slide-counter" role="status" aria-live="polite">0 / 0</span>
          <button id="next-btn" class="nav-btn" aria-label="Next slide">&gt;</button>
        </div>
        <div id="slide-carousel" class="slide-carousel"></div>
      </section>
    </main>

    <!-- Font suggestions datalist -->
    <datalist id="font-suggestions">
      <option value="Kaiti SC">
      <option value="Noto Sans SC">
      <option value="Microsoft YaHei">
      <option value="PingFang SC">
      <option value="SimHei">
      <option value="Calibri">
      <option value="Arial">
      <option value="Helvetica">
      <option value="Georgia">
      <option value="Verdana">
      <option value="Times New Roman">
      <option value="Courier New">
      <option value="Impact">
      <option value="Comic Sans MS">
    </datalist>
  </div>

  <div id="measure-box" style="visibility: hidden; position: absolute; pointer-events: none; width: 864px; line-height: 1.3; overflow-wrap: break-word; white-space: pre-line;">
    <div class="primary-measure"></div>
    <div class="secondary-measure" style="line-height: 1.4;"></div>
  </div>

  <dialog id="bible-picker-dialog" class="picker-dialog">
    <div class="picker-header">
      <h3>Select Bible Book</h3>
      <button id="close-picker-btn" class="close-btn">&times;</button>
    </div>
    <div class="picker-body">
      <div class="picker-section">
        <h4>Old Testament 旧约</h4>
        <div id="ot-grid" class="book-grid"></div>
      </div>
      <div class="picker-section">
        <h4>New Testament 新约</h4>
        <div id="nt-grid" class="book-grid"></div>
      </div>
    </div>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
