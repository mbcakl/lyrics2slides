<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyrics2Slides</title>
  <script>
    // Apply the saved UI theme before first paint (validated again in src/theme.js)
    try {
      var t = localStorage.getItem('lyrics2slides_theme');
      if (t === 'classic') t = 'midnight';
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <h1 class="logo">
          <span class="logo-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
          </span>
          Lyrics2Slides
        </h1>
        <div class="tabs" role="tablist" aria-label="Source">
          <button id="tab-lyrics" class="tab-btn">Lyrics</button>
          <button id="tab-bible" class="tab-btn active">Bible</button>
        </div>
      </div>
      <div class="header-controls">
        <label class="bg-control" for="bg-color">Background
          <input type="color" id="bg-color" value="#000000" aria-label="Slide background color">
        </label>
        <label class="bg-control theme-control" for="theme-select">Theme
          <select id="theme-select" class="theme-select"></select>
        </label>
        <details class="header-help">
          <summary class="btn-icon" aria-label="Help">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.5"/></svg>
          </summary>
          <div class="help-popover">
            <div class="quick-start-title">Quick Start</div>
            <ul class="quick-start-tips">
              <li>Separate slides with <strong>blank lines</strong></li>
              <li>Primary & Secondary lyrics pair by section order</li>
              <li><kbd>&larr;</kbd> <kbd>&rarr;</kbd> Navigate slides</li>
            </ul>
          </div>
        </details>
        <button id="present-btn" class="btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
          Present
        </button>
        <button id="download-btn" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
          <span class="btn-label">Download PPTX</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Left: Lyrics Input -->
      <section class="input-section glass">
        <div id="lyrics-container" style="display: none;">
          <div class="saved-lyrics-bar">
            <span class="section-label">Saved songs</span>
            <button id="save-lyrics-btn" class="btn-chip" title="Save to Quick Access">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
              Save song
            </button>
          </div>

          <div id="saved-lyrics-grid" class="saved-lyrics-grid"></div>

          <!-- Primary -->
          <div class="textarea-group">
            <label for="primary-lyrics" class="section-label">Primary</label>
            <div class="editor-well">
              <textarea
                id="primary-lyrics"
                placeholder="Paste lyrics here...&#10;&#10;Separate slides with blank lines"
              ></textarea>
              <div class="font-settings">
                <input type="text" id="font-primary" list="font-suggestions" value="Kaiti SC" placeholder="Font name" aria-label="Primary font family">
                <span class="size-field"><input type="number" id="size-primary" min="8" max="200" value="64" aria-label="Primary font size"><span class="size-unit">pt</span></span>
                <input type="color" id="color-primary" value="#ffff00" aria-label="Primary font color">
                <label class="bold-label"><input type="checkbox" id="bold-primary" checked aria-label="Primary bold">B</label>
              </div>
            </div>
          </div>

          <!-- Secondary -->
          <div class="textarea-group" id="secondary-group">
            <label for="secondary-lyrics" class="section-label">Secondary</label>
            <div class="editor-well">
              <textarea
                id="secondary-lyrics"
                placeholder="Paste lyrics here...&#10;&#10;Separate slides with blank lines"
              ></textarea>
              <div class="font-settings" id="secondary-font-group">
                <input type="text" id="font-secondary" list="font-suggestions" value="Calibri" placeholder="Font name" aria-label="Secondary font family">
                <span class="size-field"><input type="number" id="size-secondary" min="8" max="200" value="40" aria-label="Secondary font size"><span class="size-unit">pt</span></span>
                <input type="color" id="color-secondary" value="#ffff00" aria-label="Secondary font color">
                <label class="bold-label"><input type="checkbox" id="bold-secondary" checked aria-label="Secondary bold">B</label>
              </div>
            </div>
          </div>
        </div>

        <div id="bible-container">
          <div class="textarea-group bible-search">
            <label for="bible-smart-input" class="section-label">Book &amp; Verse</label>
            <div class="search-row">
              <div class="search-field">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
                <input type="text" id="bible-smart-input" placeholder="e.g., csj 3:16, John 1:1" autocomplete="off">
              </div>
              <button id="bible-search-btn" class="btn-icon btn-icon-accent" title="Search" aria-label="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>
              </button>
              <button id="bible-book-picker-btn" class="btn-icon" title="Open Book Picker" aria-label="Open book picker">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
              </button>
              <button id="save-bible-btn" class="btn-icon" title="Save to Quick Access" aria-label="Save to quick access">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
              </button>

              <!-- Autocomplete Dropdown -->
              <div id="bible-autocomplete-dropdown" class="autocomplete-dropdown" style="display: none;">
                <!-- Items will be injected here -->
              </div>
            </div>
          </div>

          <div class="control-row">
            <div class="textarea-group">
              <label for="bible-translation-primary">Primary</label>
              <select id="bible-translation-primary" class="text-input">
                <option value="CUNPSS-神" selected>CUNPSS (The Chinese Union Version)</option>
                <option value="NIV">NIV (New International Version)</option>
                <option value="KJV">KJV (King James Version)</option>
              </select>
            </div>

            <div class="textarea-group">
              <label class="checkbox-label">
                <input type="checkbox" id="bible-secondary-enable"> Secondary
              </label>
              <select id="bible-translation-secondary" class="text-input" disabled aria-label="Secondary translation">
                <option value="NIV">NIV (New International Version)</option>
                <option value="CUNPSS-神">CUNPSS (The Chinese Union Version)</option>
                <option value="KJV" selected>KJV (King James Version)</option>
              </select>
            </div>
          </div>

          <div id="saved-verses-grid" class="saved-verses-grid"></div>

          <div class="textarea-group">
            <label for="bible-primary-text" class="section-label">Primary Verses (Editable)</label>
            <div class="editor-well">
              <textarea id="bible-primary-text" placeholder="Fetched verses will appear here..."></textarea>
              <div class="font-settings" id="bible-primary-font-group">
                <input type="text" id="bible-font-primary" list="font-suggestions" value="Kaiti SC" placeholder="Font name" aria-label="Primary font family">
                <span class="size-field"><input type="number" id="bible-size-primary" min="8" max="200" value="40" aria-label="Primary font size"><span class="size-unit">pt</span></span>
                <input type="color" id="bible-color-primary" value="#ffff00" aria-label="Primary font color">
                <label class="bold-label"><input type="checkbox" id="bible-bold-primary" checked aria-label="Primary bold">B</label>
              </div>
            </div>
          </div>

          <div class="textarea-group bible-secondary-group" id="bible-secondary-group" style="opacity: 0.4; pointer-events: none;">
            <label for="bible-secondary-text" class="section-label">Secondary Verses (Editable)</label>
            <div class="editor-well">
              <textarea id="bible-secondary-text" placeholder="Fetched verses will appear here..." disabled></textarea>
              <div class="font-settings" id="bible-secondary-font-group">
                <input type="text" id="bible-font-secondary" list="font-suggestions" value="Calibri" placeholder="Font name" aria-label="Secondary font family">
                <span class="size-field"><input type="number" id="bible-size-secondary" min="8" max="200" value="40" aria-label="Secondary font size"><span class="size-unit">pt</span></span>
                <input type="color" id="bible-color-secondary" value="#ffff00" aria-label="Secondary font color">
                <label class="bold-label"><input type="checkbox" id="bible-bold-secondary" checked aria-label="Secondary bold">B</label>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Right: Slide Preview -->
      <section class="preview-section">
        <div id="slide-preview" class="slide-preview">
          <div class="slide-content">
            <div id="primary-text" class="primary-text"></div>
            <div id="secondary-text" class="secondary-text"></div>
          </div>
        </div>
        <div class="slide-nav">
          <div class="slide-nav-pill glass">
            <button id="prev-btn" class="nav-btn" aria-label="Previous slide">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <span id="slide-counter" role="status" aria-live="polite">0 / 0</span>
            <button id="next-btn" class="nav-btn" aria-label="Next slide">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
        <div id="slide-carousel" class="slide-carousel glass"></div>
      </section>
    </main>

    <!-- Font suggestions datalist -->
    <datalist id="font-suggestions">
      <option value="Kaiti SC">
      <option value="Noto Sans SC">
      <option value="Microsoft YaHei">
      <option value="PingFang SC">
      <option value="SimHei">
      <option value="Calibri">
      <option value="Arial">
      <option value="Helvetica">
      <option value="Georgia">
      <option value="Verdana">
      <option value="Times New Roman">
      <option value="Courier New">
      <option value="Impact">
      <option value="Comic Sans MS">
    </datalist>
  </div>

  <div id="measure-box" style="visibility: hidden; position: absolute; pointer-events: none; width: 864px; line-height: 1.3; overflow-wrap: break-word; white-space: pre-line;">
    <div class="primary-measure"></div>
    <div class="secondary-measure" style="line-height: 1.4;"></div>
  </div>

  <dialog id="bible-picker-dialog" class="picker-dialog">
    <div class="picker-header">
      <h3>Select a book</h3>
      <button id="close-picker-btn" class="close-btn" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="picker-body">
      <div class="picker-section">
        <h4>Old Testament 旧约</h4>
        <div id="ot-grid" class="book-grid"></div>
      </div>
      <div class="picker-section">
        <h4>New Testament 新约</h4>
        <div id="nt-grid" class="book-grid"></div>
      </div>
    </div>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
